<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Muat Barang</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="./firebase-config.js"></script>
<style>
:root{--ink:#0E2A3E;--ink-2:#173B54;--surface:#F5F6F3;--surface-2:#FFFFFF;--line:#DEE3DF;--muted:#5E6E71;--go:#1F8A4C;--go-dark:#186B3B;--live:#FF8A1E;--danger:#C64B3C;--radius:14px;--font-display:'Space Grotesk',system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;}
*{box-sizing:border-box;}body{margin:0;font-family:var(--font-body);background:var(--surface);color:var(--ink);}
.wrap{max-width:800px;margin:0 auto;padding:20px 16px 80px;}
header h1{font-family:var(--font-display);font-size:20px;margin:0 0 4px;}header p{margin:0;color:var(--muted);font-size:13px;}
.card{background:var(--surface-2);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(14,42,62,0.08);}
.card h2{font-family:var(--font-display);font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.badge{background:var(--surface);color:var(--ink-2);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.btn{border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--font-body);width:100%;}
.btn-primary{background:var(--ink-2);color:#fff;}.btn-primary:disabled{background:#B7C0C7;cursor:not-allowed;}
.btn-go{background:var(--go);color:#fff;}.btn-outline{background:var(--surface);color:var(--ink-2);border:1.5px solid var(--line);}
.btn-sm{padding:7px 12px;font-size:12px;width:auto;}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;}.hint b{color:var(--ink-2);}
.divider{height:1px;background:var(--line);margin:14px 0;}
.conn-status{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:10px 12px;border-radius:9px;background:var(--surface);margin-bottom:14px;}
.conn-status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
.conn-status.ok .dot{background:var(--go);}.conn-status.ok{color:var(--go-dark);background:#EAF7EE;}
.conn-status.err .dot{background:var(--danger);}.conn-status.err{color:var(--danger);background:#FCEAE7;}
.nav-row{display:flex;gap:8px;margin-bottom:14px;}
.nav-row button{flex:1;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:10px;padding:10px;font-weight:700;font-size:12.5px;cursor:pointer;}
.vehicle-row{display:flex;gap:6px;margin:10px 0;overflow-x:auto;flex-wrap:wrap;}
.vchip{flex:none;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;opacity:0.55;border:2px solid transparent;}
.vchip.active{opacity:1;border-color:var(--ink);}
.prog-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:6px;}
.pstat{background:var(--surface);border-radius:10px;padding:10px;text-align:center;}
.pstat .num{font-family:var(--font-display);font-weight:700;font-size:20px;}.pstat .lbl{font-size:10.5px;color:var(--muted);font-weight:600;}
.pstat.green .num{color:var(--go);}.pstat.red .num{color:var(--danger);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;padding:6px 8px;border-bottom:1.5px solid var(--line);}
td{padding:9px 8px;border-bottom:1px solid var(--surface);vertical-align:middle;}
td.num{text-align:right;font-variant-numeric:tabular-nums;}
tr.invoice-row{cursor:pointer;}
tr.invoice-row:active{background:var(--surface);}
tr.invoice-row.done{background:#F6FBF7;}
.status-icon{font-size:14px;}
.empty-row{color:var(--muted);text-align:center;padding:30px;font-size:13px;}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:999;transition:transform .25s;box-shadow:0 4px 16px rgba(0,0,0,0.3);}
#toast.show{transform:translateX(-50%) translateY(0);}
/* Detail view */
#detailView{display:none;}
#detailView.show{display:block;}
#listView.hide{display:none;}
.detail-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px;}
.detail-hdr .outlet-name{font-family:var(--font-display);font-weight:700;font-size:16px;}
.detail-hdr .inv-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.back-btn{border:none;background:var(--surface);color:var(--ink-2);border-radius:9px;padding:9px 14px;font-weight:700;font-size:12.5px;cursor:pointer;flex:none;}
.sku-row{padding:11px 0;border-bottom:1px solid var(--surface);font-size:12.5px;}
.sku-row.flash{animation:flashgreen .6s ease;}
@keyframes flashgreen{0%{background:#BEF0CC;}100%{background:transparent;}}
.sku-row .sku-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.sku-row .sname{flex:1;min-width:0;}.sku-row .sname .code{color:var(--muted);font-size:10.5px;display:block;}
.sku-icon{flex:none;width:20px;text-align:center;font-size:13px;}
.qty-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-left:28px;}
.qty-fields .qfield{text-align:center;}
.qty-fields label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;}
.qty-fields input{width:100%;text-align:center;padding:7px 4px;font-size:14px;border:1.5px solid var(--line);border-radius:8px;}
.qty-fields input.match{border-color:var(--go);background:#F1F8F3;}
.qty-fields input.mismatch{border-color:var(--danger);background:#FEF1F0;}
.qty-fields .qexp{display:block;font-size:9.5px;color:var(--muted);margin-top:3px;}
.scan-btn{background:var(--live);color:#fff;border:none;border-radius:8px;padding:11px 12px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin-bottom:12px;}
.save-row-btn{margin-top:12px;}
/* Scanner modal */
#scanModal{position:fixed;inset:0;background:rgba(14,42,62,0.92);z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
#scanModal.show{display:flex;}
#scanModal .scan-box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px;}
#scanModal h3{font-family:var(--font-display);margin:0 0 10px;font-size:15px;text-align:center;}
#qr-reader{width:100%;border-radius:10px;overflow:hidden;}
#scanModal .scan-feedback{margin-top:10px;text-align:center;font-size:13px;font-weight:700;min-height:20px;}
#scanModal .scan-feedback.ok{color:var(--go-dark);}
#scanModal .scan-feedback.bad{color:var(--danger);}
#scanModal .scan-feedback.warn{color:#8A5A16;}
#scanModal .close-scan{margin-top:10px;background:var(--surface);color:var(--ink-2);border:none;border-radius:9px;padding:10px;font-weight:700;width:100%;cursor:pointer;}
#scanModal .invoice-label{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;}
/* Cross-invoice prompt */
.switch-prompt{background:#FDF3E7;border:1.5px solid var(--live);border-radius:10px;padding:12px;margin-top:10px;font-size:12.5px;}
.switch-prompt b{color:#8A5A16;}
.switch-prompt .btn-row{display:flex;gap:8px;margin-top:10px;}
.switch-prompt .btn-row button{flex:1;border:none;border-radius:8px;padding:9px;font-weight:700;font-size:12px;cursor:pointer;}
.switch-prompt .btn-switch{background:var(--live);color:#fff;}
.switch-prompt .btn-stay{background:var(--surface-2);color:var(--ink-2);border:1.5px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
<div class="nav-row"><button id="navMap">🗺️ Kembali ke Peta</button><button id="navAdmin">⚙️ Admin</button><button id="navDashboard">📊 Dashboard</button></div>
<header><h1>✅ Verifikasi Muat Barang</h1><p>Pilih invoice, lalu cocokkan barang dengan scan barcode.</p></header>

<div class="conn-status" id="connStatus"><div class="dot"></div><span id="connStatusText">Menghubungkan ke Firebase…</span></div>

<!-- ===== LIST VIEW ===== -->
<div id="listView">
<div class="card">
<h2>📋 Daftar Invoice <span class="badge" id="countInv">0</span></h2>
<div class="vehicle-row" id="vehicleRow"></div>
<div class="prog-summary" id="progSummary"></div>
<div style="overflow-x:auto;">
<table><thead><tr><th>No.</th><th>Tgl</th><th>No Invoice</th><th>Outlet</th><th class="num">Nilai</th><th></th><th></th></tr></thead><tbody id="invoiceListBody"></tbody></table>
</div>
<div class="empty-row" id="listEmpty" style="display:none;">Belum ada invoice untuk kendaraan ini.</div>
</div>
</div>

<!-- ===== DETAIL VIEW ===== -->
<div id="detailView">
<div class="card">
<div class="detail-hdr">
  <div><div class="outlet-name" id="detailOutletName"></div><div class="inv-meta" id="detailInvMeta"></div></div>
  <button class="back-btn" id="backToList">← Daftar</button>
</div>
<button class="scan-btn" id="scanBtn">📷 Scan Barcode</button>
<div id="switchPromptArea"></div>
<div id="skuRowsArea"></div>
<button class="btn btn-primary save-row-btn" id="saveDetailBtn">💾 Simpan Pengecekan</button>
</div>
</div>

</div>
<div id="toast"></div>

<div id="scanModal">
  <div class="scan-box">
    <h3>📷 Pindai Barcode</h3>
    <div class="invoice-label" id="scanInvoiceLabel"></div>
    <div id="qr-reader"></div>
    <div class="scan-feedback" id="scanFeedback"></div>
    <button class="close-scan" id="closeScanBtn">Tutup Scanner</button>
  </div>
</div>

<script>
/* ===== State ===== */
let OUTLETS=[],RENCANA=null,INVOICES={},MUAT_CHECK={checks:{}},SKU_MASTER={skuInfo:{},barcodeToSku:{}};
let outletByCc={},currentVehicle='all',fbConnected=false,codStops=[];
let html5QrCode=null,currentInvoiceNo=null;
let skuToInvoices={}; // skuCode -> [invoiceNo,...] within today's plan (for cross-invoice hints)

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtRp(n){return'Rp '+Number(n).toLocaleString('id-ID');}
function last5(cc){cc=String(cc||'');return cc.length>5?cc.slice(-5):cc;}
let toastTimer;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3600);}

/* ===== Boot ===== */
async function initConnection(){
  const el=document.getElementById('connStatus'),txt=document.getElementById('connStatusText');
  try{
    if(typeof FIREBASE_CONFIGURED==='undefined'){el.className='conn-status err';txt.textContent='firebase-config.js gagal dimuat.';return false;}
    if(!FIREBASE_CONFIGURED){el.className='conn-status err';txt.textContent='Firebase belum dikonfigurasi.';return false;}
    const ok=await firebaseReady;
    if(ok){el.className='conn-status ok';txt.textContent='Terhubung ke Firebase.';return true;}
    el.className='conn-status err';txt.textContent='Gagal terhubung ke Firebase.';return false;
  }catch(err){console.error(err);el.className='conn-status err';txt.textContent='Error: '+err.message;return false;}
}

async function boot(){
  fbConnected=await initConnection();
  try{const r=await fetch('./outlets.json',{cache:'no-store'});OUTLETS=await r.json();OUTLETS.forEach(o=>{outletByCc[o.cc]=o;});}catch(e){}
  try{const r=await fetch('./sku_master.json');SKU_MASTER=await r.json();}catch(e){console.error(e);}

  if(fbConnected){
    try{const doc=await db.collection('rencana').doc('current').get();if(doc.exists)RENCANA=doc.data();}catch(e){console.error(e);}
    if(RENCANA&&RENCANA.vehicles){
      const invoiceNos=new Set();
      RENCANA.vehicles.forEach(v=>(v.stops||[]).forEach(s=>invoiceNos.add(s.invoiceNo)));
      // Ambil detail tiap invoice (SKU-level) dari koleksi invoices
      await Promise.all([...invoiceNos].map(async invNo=>{
        try{const doc=await db.collection('invoices').doc(sanitizeDocId(invNo)).get();if(doc.exists)INVOICES[invNo]=doc.data();}catch(e){console.error(e);}
      }));
    }
    // Invoice berstatus COD juga perlu dicek checker sebelum diambil —
    // ambil terpisah, tidak tergantung pada rencana/kendaraan.
    try{
      const snap=await db.collection('invoices').where('status','==','cod').get();
      snap.forEach(doc=>{
        const inv=doc.data();
        INVOICES[inv.invoiceNo]=inv;
        codStops.push({cc:inv.outletCode,invoiceNo:inv.invoiceNo,invoiceValue:inv.totalValue||0,vehicleId:'cod',vehicleName:'COD',vehicleHex:'#8A5A16'});
      });
    }catch(e){console.error('Gagal memuat invoice COD:',e);}
    try{const snap=await db.collection('muatChecks').get();snap.forEach(doc=>{MUAT_CHECK.checks[doc.id]=doc.data();});}catch(e){console.error(e);}
    db.collection('muatChecks').onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{if(ch.type!=='removed')MUAT_CHECK.checks[ch.doc.id]=ch.doc.data();});
      if(currentInvoiceNo)renderDetail(currentInvoiceNo);else renderList();
    },err=>console.error(err));
  }

  buildSkuIndex();
  buildVehicleChips();
  renderList();
}

function buildSkuIndex(){
  skuToInvoices={};
  Object.values(INVOICES).forEach(inv=>{
    (inv.lines||[]).forEach(line=>{
      if(!skuToInvoices[line.skuCode])skuToInvoices[line.skuCode]=[];
      if(!skuToInvoices[line.skuCode].includes(inv.invoiceNo))skuToInvoices[line.skuCode].push(inv.invoiceNo);
    });
  });
}

/* ===== Vehicle chips ===== */
function buildVehicleChips(){
  const row=document.getElementById('vehicleRow');
  const vehicleChips=(RENCANA&&RENCANA.vehicles&&RENCANA.vehicles.length)?RENCANA.vehicles.map(v=>'<div class="vchip" data-v="'+v.id+'" style="background:'+(v.hex||'#555')+';">'+escapeHtml(v.name)+'</div>').join(''):'';
  const codChip=codStops.length?'<div class="vchip" data-v="cod" style="background:#8A5A16;">🚚 COD ('+codStops.length+')</div>':'';
  if(!vehicleChips&&!codChip){row.innerHTML='';return;}
  row.innerHTML='<div class="vchip active" data-v="all" style="background:#0E2A3E;">Semua</div>'+vehicleChips+codChip;
  row.querySelectorAll('.vchip').forEach(chip=>chip.addEventListener('click',()=>{
    currentVehicle=chip.dataset.v;
    row.querySelectorAll('.vchip').forEach(c=>c.classList.toggle('active',c===chip));
    renderList();
  }));
}

/* ===== List View ===== */
function checkKey(invoiceNo,sku){return sanitizeDocId(invoiceNo+'|'+sku);}
function lineIsMatch(ck,line){
  return Number(ck.qty_karton)===Number(line.caseQty||0)
    && Number(ck.qty_lusin)===Number(line.dozenQty||0)
    && Number(ck.qty_pcs)===Number(line.piecesQty||0);
}
function invoiceCheckStatus(invNo){
  const inv=INVOICES[invNo];
  if(!inv||!inv.lines||!inv.lines.length)return'nodata';
  let allFilled=true,allMatch=true;
  inv.lines.forEach(line=>{
    const ck=MUAT_CHECK.checks[checkKey(invNo,line.skuCode)];
    if(!ck){allFilled=false;return;}
    if(!lineIsMatch(ck,line))allMatch=false;
  });
  if(!allFilled)return'pending';
  return allMatch?'ok':'mismatch';
}

function renderList(){
  const hasVehiclePlan=RENCANA&&RENCANA.vehicles&&RENCANA.vehicles.length;
  if(!hasVehiclePlan&&!codStops.length){
    document.getElementById('listEmpty').style.display='block';
    document.getElementById('listEmpty').textContent='Rencana pengantaran & invoice COD belum tersedia. Publikasikan dari admin.html dulu.';
    document.getElementById('invoiceListBody').innerHTML='';document.getElementById('progSummary').innerHTML='';return;
  }
  let stops=[];
  if(currentVehicle==='cod'){
    stops=codStops.slice();
  }else if(currentVehicle==='all'){
    if(hasVehiclePlan)RENCANA.vehicles.forEach(v=>(v.stops||[]).forEach(s=>stops.push(Object.assign({},s,{vehicleId:v.id,vehicleName:v.name,vehicleHex:v.hex}))));
    stops=stops.concat(codStops);
  }else{
    if(hasVehiclePlan){
      const v=RENCANA.vehicles.find(vv=>vv.id===currentVehicle);
      if(v)(v.stops||[]).forEach(s=>stops.push(Object.assign({},s,{vehicleId:v.id,vehicleName:v.name,vehicleHex:v.hex})));
    }
  }
  document.getElementById('countInv').textContent=stops.length;

  if(!stops.length){
    document.getElementById('listEmpty').style.display='block';
    document.getElementById('listEmpty').textContent='Tidak ada invoice untuk filter ini.';
    document.getElementById('invoiceListBody').innerHTML='';document.getElementById('progSummary').innerHTML='';return;
  }
  document.getElementById('listEmpty').style.display='none';

  let okCount=0,mismatchCount=0,pendingCount=0;
  const body=document.getElementById('invoiceListBody');
  body.innerHTML=stops.map((s,i)=>{
    const outlet=outletByCc[s.cc];
    const status=invoiceCheckStatus(s.invoiceNo);
    if(status==='ok')okCount++;else if(status==='mismatch')mismatchCount++;else pendingCount++;
    const icon=status==='ok'?'✅':status==='mismatch'?'⚠️':status==='nodata'?'❔':'⬜';
    return '<tr class="invoice-row'+(status==='ok'?' done':'')+'" data-inv="'+escapeHtml(s.invoiceNo)+'"><td>'+(i+1)+'</td><td style="font-size:11px;">'+escapeHtml((INVOICES[s.invoiceNo]||{}).invoiceDate||'-')+'</td><td>'+escapeHtml(s.invoiceNo)+'</td><td>'+last5(s.cc)+' · '+escapeHtml(outlet?outlet.n:s.cc)+'</td><td class="num">'+fmtRp(s.invoiceValue)+'</td><td><span style="font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;color:#fff;background:'+(s.vehicleHex||'#555')+';">'+escapeHtml(s.vehicleName||'')+'</span></td><td class="status-icon">'+icon+'</td></tr>';
  }).join('');
  body.querySelectorAll('.invoice-row').forEach(row=>{
    row.addEventListener('click',()=>openDetail(row.dataset.inv));
  });

  document.getElementById('progSummary').innerHTML=
    '<div class="pstat"><div class="num">'+stops.length+'</div><div class="lbl">Total Invoice</div></div>'
    +'<div class="pstat green"><div class="num">'+okCount+'</div><div class="lbl">Sesuai</div></div>'
    +'<div class="pstat red"><div class="num">'+mismatchCount+'</div><div class="lbl">Tidak Sesuai</div></div>'
    +'<div class="pstat"><div class="num">'+pendingCount+'</div><div class="lbl">Belum Dicek</div></div>';
}

/* ===== Detail View ===== */
function openDetail(invNo){
  currentInvoiceNo=invNo;
  document.getElementById('listView').classList.add('hide');
  document.getElementById('detailView').classList.add('show');
  renderDetail(invNo);
}
document.getElementById('backToList').addEventListener('click',()=>{
  currentInvoiceNo=null;
  document.getElementById('detailView').classList.remove('show');
  document.getElementById('listView').classList.remove('hide');
  renderList();
});
document.getElementById('navMap').addEventListener('click',()=>{window.location.href='./index.html';});
document.getElementById('navAdmin').addEventListener('click',()=>{window.location.href='./admin.html';});
document.getElementById('navDashboard').addEventListener('click',()=>{window.location.href='./dashboard.html';});

function renderDetail(invNo){
  const inv=INVOICES[invNo];
  const vehicleStops=(RENCANA&&RENCANA.vehicles)?RENCANA.vehicles.flatMap(v=>(v.stops||[]).map(s=>Object.assign({},s,{vehicleName:v.name,vehicleHex:v.hex}))):[];
  const stopMeta=[...vehicleStops,...codStops].find(s=>s.invoiceNo===invNo)||{};
  const outlet=outletByCc[stopMeta.cc];
  document.getElementById('detailOutletName').textContent=outlet?outlet.n:(inv?inv.outletNameExtract:stopMeta.cc)||'-';
  document.getElementById('detailInvMeta').innerHTML=escapeHtml(invNo)+' · '+fmtRp(stopMeta.invoiceValue||0)+' · <span style="color:'+(stopMeta.vehicleHex||'#555')+';font-weight:700;">'+escapeHtml(stopMeta.vehicleName||'')+'</span>';

  const area=document.getElementById('skuRowsArea');
  if(!inv||!inv.lines||!inv.lines.length){
    area.innerHTML='<div class="hint">Belum ada detail SKU untuk invoice ini.</div>';
    return;
  }
  area.innerHTML=inv.lines.map((line,i)=>{
    const ck=MUAT_CHECK.checks[checkKey(invNo,line.skuCode)];
    const filled=!!ck;
    const isMatch=filled&&lineIsMatch(ck,line);
    const icon=!filled?'⬜':(isMatch?'✅':'⚠️');
    const masterInfo=SKU_MASTER.skuInfo&&SKU_MASTER.skuInfo[line.skuCode];
    const pcPerCs=masterInfo&&masterInfo.p;
    const caseHint=pcPerCs?(' · '+pcPerCs+' pcs/karton'):'';
    const kVal=filled?ck.qty_karton:'', lVal=filled?ck.qty_lusin:'', pVal=filled?ck.qty_pcs:'';
    const kCls=filled?(Number(ck.qty_karton)===Number(line.caseQty||0)?'match':'mismatch'):'';
    const lCls=filled?(Number(ck.qty_lusin)===Number(line.dozenQty||0)?'match':'mismatch'):'';
    const pCls=filled?(Number(ck.qty_pcs)===Number(line.piecesQty||0)?'match':'mismatch'):'';
    return '<div class="sku-row" data-sku="'+escapeHtml(line.skuCode)+'" data-case="'+(line.caseQty||0)+'" data-dozen="'+(line.dozenQty||0)+'" data-pieces="'+(line.piecesQty||0)+'">'
      +'<div class="sku-top"><span class="sku-icon">'+icon+'</span><div class="sname">'+escapeHtml(line.skuName)+'<span class="code">'+escapeHtml(line.skuCode)+caseHint+'</span></div></div>'
      +'<div class="qty-fields">'
      +'<div class="qfield"><label>Karton</label><input type="number" min="0" class="karton-input '+kCls+'" value="'+kVal+'" placeholder="0"><span class="qexp">exp: '+(line.caseQty||0)+'</span></div>'
      +'<div class="qfield"><label>Lusin</label><input type="number" min="0" class="lusin-input '+lCls+'" value="'+lVal+'" placeholder="0"><span class="qexp">exp: '+(line.dozenQty||0)+'</span></div>'
      +'<div class="qfield"><label>Pcs</label><input type="number" min="0" class="pcs-input '+pCls+'" value="'+pVal+'" placeholder="0"><span class="qexp">exp: '+(line.piecesQty||0)+'</span></div>'
      +'</div></div>';
  }).join('');
  area.querySelectorAll('.sku-row').forEach(row=>{
    const recalcRow=()=>{
      const kInp=row.querySelector('.karton-input'),lInp=row.querySelector('.lusin-input'),pInp=row.querySelector('.pcs-input');
      const expCase=Number(row.dataset.case),expDozen=Number(row.dataset.dozen),expPieces=Number(row.dataset.pieces);
      [[kInp,expCase],[lInp,expDozen],[pInp,expPieces]].forEach(([inp,exp])=>{
        if(inp.value===''){inp.className=inp.className.replace(/\b(match|mismatch)\b/g,'').trim();return;}
        const isM=Number(inp.value)===exp;
        inp.className=inp.className.replace(/\b(match|mismatch)\b/g,'').trim()+' '+(isM?'match':'mismatch');
      });
      const icon=row.querySelector('.sku-icon');
      if(kInp.value===''||lInp.value===''||pInp.value===''){icon.textContent='⬜';return;}
      const allMatch=Number(kInp.value)===expCase&&Number(lInp.value)===expDozen&&Number(pInp.value)===expPieces;
      icon.textContent=allMatch?'✅':'⚠️';
    };
    row.querySelectorAll('input[type=number]').forEach(inp=>inp.addEventListener('input',recalcRow));
  });
}

document.getElementById('saveDetailBtn').addEventListener('click',()=>saveInvoiceCheck(currentInvoiceNo));

async function saveInvoiceCheck(invoiceNo){
  if(!fbConnected){showToast('Belum terhubung ke Firebase.');return;}
  const rows=document.querySelectorAll('#skuRowsArea .sku-row');
  const nowIso=new Date().toISOString();
  const newChecks={};
  let hasEmpty=false;
  rows.forEach(row=>{
    const sku=row.dataset.sku;
    const kInp=row.querySelector('.karton-input'),lInp=row.querySelector('.lusin-input'),pInp=row.querySelector('.pcs-input');
    if(kInp.value===''&&lInp.value===''&&pInp.value==='')return; // baris belum disentuh sama sekali, lewati
    if(kInp.value===''||lInp.value===''||pInp.value===''){hasEmpty=true;return;}
    const karton=Number(kInp.value),lusin=Number(lInp.value),pcs=Number(pInp.value);
    const masterInfo=SKU_MASTER.skuInfo&&SKU_MASTER.skuInfo[sku];
    const pcPerCs=(masterInfo&&masterInfo.p)||0;
    const qtyLoadedPcs=(karton*pcPerCs)+(lusin*12)+pcs;
    newChecks[checkKey(invoiceNo,sku)]={invoiceNo,sku,qty_karton:karton,qty_lusin:lusin,qty_pcs:pcs,qty_loaded:qtyLoadedPcs,checked_at:nowIso};
  });
  if(hasEmpty&&!confirm('Ada baris SKU yang belum lengkap ketiga kolomnya (Karton/Lusin/Pcs). Simpan yang sudah lengkap saja?'))return;
  if(!Object.keys(newChecks).length){showToast('Belum ada qty yang diisi.');return;}
  const btn=document.getElementById('saveDetailBtn');btn.disabled=true;btn.textContent='Menyimpan…';
  try{
    const batch=db.batch();
    Object.entries(newChecks).forEach(([key,val])=>{batch.set(db.collection('muatChecks').doc(key),val);MUAT_CHECK.checks[key]=val;});
    await batch.commit();
    showToast('✅ Pengecekan '+invoiceNo+' tersimpan.');
    renderDetail(invoiceNo);
  }catch(err){console.error(err);showToast('Gagal menyimpan: '+err.message);}
  finally{btn.disabled=false;btn.textContent='💾 Simpan Pengecekan';}
}

/* ===== Barcode Scanner with cross-invoice matching ===== */
function resolveScannedCode(code){
  const candidates=[{s:code,k:null}];
  const stripped=code.replace(/^0+/,'')||'0';
  const master=(SKU_MASTER.barcodeToSku&&(SKU_MASTER.barcodeToSku[code]||SKU_MASTER.barcodeToSku[stripped]))||[];
  master.forEach(e=>{if(!candidates.some(c=>c.s===e.s))candidates.push({s:e.s,k:e.k});});
  return candidates;
}

document.getElementById('scanBtn').addEventListener('click',openScanner);
function openScanner(){
  document.getElementById('scanInvoiceLabel').textContent='Invoice: '+currentInvoiceNo;
  document.getElementById('scanFeedback').textContent='';document.getElementById('scanFeedback').className='scan-feedback';
  document.getElementById('scanModal').classList.add('show');
  if(typeof Html5Qrcode==='undefined'){
    document.getElementById('scanFeedback').textContent='Pemindai gagal dimuat. Cek koneksi internet lalu coba lagi.';
    document.getElementById('scanFeedback').className='scan-feedback bad';return;
  }
  html5QrCode=new Html5Qrcode('qr-reader');
  html5QrCode.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:120}},onScanSuccess,()=>{}).catch(err=>{
    document.getElementById('scanFeedback').textContent='Gagal mengakses kamera: '+err+'.';
    document.getElementById('scanFeedback').className='scan-feedback bad';
  });
}
document.getElementById('closeScanBtn').addEventListener('click',closeScanner);
function closeScanner(){
  document.getElementById('scanModal').classList.remove('show');
  if(html5QrCode){html5QrCode.stop().then(()=>html5QrCode.clear()).catch(()=>{});html5QrCode=null;}
}

function onScanSuccess(decodedText){
  const feedback=document.getElementById('scanFeedback');
  const candidates=resolveScannedCode(decodedText);
  const inv=INVOICES[currentInvoiceNo];

  // 1) Cek dulu apakah ada di invoice yang SEDANG dibuka
  let matched=null;
  for(const cand of candidates){
    if(inv&&inv.lines&&inv.lines.some(l=>l.skuCode===cand.s)){matched=cand;break;}
  }
  if(matched){
    const row=document.querySelector('.sku-row[data-sku="'+CSS.escape(matched.s)+'"]');
    if(row){
      // Barcode karton (CS) menambah kolom Karton; barcode satuan (PC) menambah kolom Pcs.
      const targetInput=matched.k==='CS'?row.querySelector('.karton-input'):row.querySelector('.pcs-input');
      const unitLabel=matched.k==='CS'?'karton':'pcs';
      const current=targetInput.value===''?0:Number(targetInput.value);
      targetInput.value=current+1;
      targetInput.dispatchEvent(new Event('input'));
      row.classList.remove('flash');void row.offsetWidth;row.classList.add('flash');
      feedback.textContent='✅ '+row.querySelector('.sname').textContent.split('\n')[0]+' → +1 '+unitLabel+' ('+targetInput.value+')';
      feedback.className='scan-feedback ok';
      if(navigator.vibrate)navigator.vibrate(80);
    }
    return;
  }

  // 2) Tidak ada di invoice ini — cek apakah ada di invoice LAIN dalam rencana hari ini
  let otherInvoiceNo=null,otherSku=null;
  for(const cand of candidates){
    const owners=(skuToInvoices[cand.s]||[]).filter(n=>n!==currentInvoiceNo);
    if(owners.length){otherInvoiceNo=owners[0];otherSku=cand.s;break;}
  }
  if(otherInvoiceNo){
    const otherInv=INVOICES[otherInvoiceNo];
    const otherLine=otherInv.lines.find(l=>l.skuCode===otherSku);
    const otherOutlet=outletByCc[otherInv.outletCode];
    feedback.innerHTML='⚠️ "'+escapeHtml(otherLine.skuName)+'" tidak ada di invoice ini — barang ini ada di invoice <b>'+escapeHtml(otherInvoiceNo)+'</b> ('+escapeHtml(otherOutlet?otherOutlet.n:otherInv.outletCode)+').<br><small>Saran: selesaikan dulu invoice yang sedang dikerjakan sebelum pindah.</small>';
    feedback.className='scan-feedback warn';
    if(navigator.vibrate)navigator.vibrate([100,60,100]);
    showSwitchPrompt(otherInvoiceNo);
    return;
  }

  // 3) Sama sekali tidak dikenali di invoice manapun hari ini
  const knownName=SKU_MASTER.skuInfo&&candidates.map(c=>SKU_MASTER.skuInfo[c.s]&&SKU_MASTER.skuInfo[c.s].n).find(Boolean);
  feedback.textContent=knownName
    ? '❌ "'+knownName+'" dikenali sebagai produk, tapi tidak ada di invoice manapun hari ini. Cek ulang barangnya.'
    : '❌ Barcode "'+decodedText+'" tidak dikenali. Cek ulang atau cari barang yang sesuai.';
  feedback.className='scan-feedback bad';
  if(navigator.vibrate)navigator.vibrate(200);
}

function showSwitchPrompt(otherInvoiceNo){
  const area=document.getElementById('switchPromptArea');
  const otherOutlet=outletByCc[(INVOICES[otherInvoiceNo]||{}).outletCode];
  area.innerHTML='<div class="switch-prompt">⚠️ Ada barang yang cocok di invoice lain: <b>'+escapeHtml(otherInvoiceNo)+'</b> ('+escapeHtml(otherOutlet?otherOutlet.n:'')+'). Selesaikan invoice ini dulu disarankan — tapi Anda bisa pindah kalau perlu.'
    +'<div class="btn-row"><button class="btn-stay" id="stayBtn">Tetap di Invoice Ini</button><button class="btn-switch" id="switchBtn">Pindah ke Invoice Itu</button></div></div>';
  document.getElementById('stayBtn').addEventListener('click',()=>{area.innerHTML='';});
  document.getElementById('switchBtn').addEventListener('click',()=>{
    area.innerHTML='';
    closeScanner();
    openDetail(otherInvoiceNo);
  });
}

boot();
